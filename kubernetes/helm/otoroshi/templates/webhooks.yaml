{{/*
The webhook MUST target the very service passed as `otoroshiServiceName` in the
KubernetesConfig of the deployment templates: the sinks that answer these calls only
match a Host of `<otoroshiServiceName>.<namespace>.svc[.cluster.local]` (see
KubernetesAdmissionWebhookCRDValidator.matches), and the certificate Otoroshi generates
for that endpoint is issued for those two SANs only (see createWebhookCerts).

`clientConfig.caBundle` and `failurePolicy` are rewritten at runtime by Otoroshi (field
manager `pekko-http`, see KubernetesCRDsJob.patchValidatingAdmissionWebhook): it injects
its CA and switches the webhook to `Fail` once it can answer. The chart renders the live
values of these two fields, and `""` / `Ignore` only on the first install. Rendering other
values would reset them on each upgrade, and is a conflict with Helm 4 server-side apply.
*/}}
{{- $webhookServiceName := ternary .Values.cluster.workerServiceName .Values.service.name .Values.cluster.enabled -}}
{{- if .Values.webhooks.validation }}
{{- $live := include "otoroshi.liveWebhook" (dict "kind" "ValidatingWebhookConfiguration" "name" "otoroshi-admission-webhook-validation" "webhook" "otoroshi-admission-webhook.otoroshi.io") | fromJson }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: otoroshi-admission-webhook-validation
  labels:
    {{- include "otoroshi.labels" . | nindent 4 }}
    app.kubernetes.io/component: otoroshi-validation-webhook
webhooks:
  - name: otoroshi-admission-webhook.otoroshi.io
    rules:
      - operations: 
          - "CREATE"
          - "UPDATE"
        apiGroups: 
          - "proxy.otoroshi.io"
        apiVersions: 
          - "*"
        resources: 
          - "*"
        scope: "Namespaced"
    clientConfig:
      # url: "https://otoroshi-kubernetes-admission-webhook.otoroshi.svc.cluster.local:8443/apis/webhooks/validation"
      service:
        name: {{ $webhookServiceName }}
        namespace: {{ .Release.Namespace }}
        path: "/apis/webhooks/validation"
        port: {{ .Values.service.https }}
      caBundle: {{ dig "clientConfig" "caBundle" "" $live | quote }} # injected at runtime, see above
    failurePolicy: {{ dig "failurePolicy" "Ignore" $live }}
    sideEffects: None
    admissionReviewVersions: 
      - "v1"
{{- end }}
{{- if .Values.webhooks.sidecarInject }}
{{- $live := include "otoroshi.liveWebhook" (dict "kind" "MutatingWebhookConfiguration" "name" "otoroshi-admission-webhook-injector" "webhook" "otoroshi-admission-webhook-injector.otoroshi.io") | fromJson }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: otoroshi-admission-webhook-injector
  labels:
    {{- include "otoroshi.labels" . | nindent 4 }}
    app.kubernetes.io/component: otoroshi-sidecar-injector-webhook
webhooks:
  - name: otoroshi-admission-webhook-injector.otoroshi.io
    rules:
      - operations: 
          - "CREATE"
        apiGroups: 
          - ""
        apiVersions: 
          - "v1"
        resources: 
          - "pods"
        scope: "Namespaced"
    # namespaceSelector:
    #   matchLabels:
    #     otoroshi.io/sidecar: inject
    objectSelector:
      matchLabels:
        otoroshi.io/sidecar: inject
    clientConfig:
      # url: "https://otoroshi-kubernetes-admission-webhook.otoroshi.svc.cluster.local:8443/apis/webhooks/inject"
      service:
        name: {{ $webhookServiceName }}
        namespace: {{ .Release.Namespace }}
        path: "/apis/webhooks/inject"
        port: {{ .Values.service.https }}
      caBundle: {{ dig "clientConfig" "caBundle" "" $live | quote }} # injected at runtime, see above
    failurePolicy: {{ dig "failurePolicy" "Ignore" $live }}
    sideEffects: None
    admissionReviewVersions: 
      - "v1"
{{- end }}

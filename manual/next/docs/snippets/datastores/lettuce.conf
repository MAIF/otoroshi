otoroshi {
  storage = "lettuce"
  redis { 
    lettuce { # configuration to fetch/store otoroshi state from a redis datastore using the lettuce driver (the next default one)
      connection = "default"
      connection = ${?REDIS_LETTUCE_CONNECTION}
      connection = ${?OTOROSHI_REDIS_LETTUCE_CONNECTION}
      uri =  ${?REDIS_LETTUCE_URI}
      uri =  ${?OTOROSHI_REDIS_LETTUCE_URI}
      uri =  ${?REDIS_URL}
      uri =  ${?OTOROSHI_REDIS_URL}
      uris = []
      urisStr = ${?REDIS_LETTUCE_URIS}
      urisStr = ${?OTOROSHI_REDIS_LETTUCE_URIS}
      readFrom = "MASTER_PREFERRED"
      readFrom = ${?REDIS_LETTUCE_READ_FROM}
      readFrom = ${?OTOROSHI_REDIS_LETTUCE_READ_FROM}
      startTLS = false
      startTLS = ${?REDIS_LETTUCE_START_TLS}
      startTLS = ${?OTOROSHI_REDIS_LETTUCE_START_TLS}
      verifyPeers = true
      verifyPeers = ${?REDIS_LETTUCE_VERIFY_PEERS}
      verifyPeers = ${?OTOROSHI_REDIS_LETTUCE_VERIFY_PEERS}
      ssl { # TLS material used when the redis uri uses TLS (rediss:// or startTLS). each value holds the PEM itself, its base64 encoded form, or file:///path/to/file.pem
        trustedCerts = ${?OTOROSHI_REDIS_LETTUCE_SSL_TRUSTED_CERTS} # PEM bundle of the certificate authorities to trust when connecting to redis
        clientCert = ${?OTOROSHI_REDIS_LETTUCE_SSL_CLIENT_CERT} # PEM of the client certificate chain used for mTLS
        clientKey = ${?OTOROSHI_REDIS_LETTUCE_SSL_CLIENT_KEY} # PEM of the client private key used for mTLS. optional when clientCert holds it too
        clientKeyPassword = ${?OTOROSHI_REDIS_LETTUCE_SSL_CLIENT_KEY_PASSWORD} # password of the client private key when it is encrypted
      }
    }
  }
}
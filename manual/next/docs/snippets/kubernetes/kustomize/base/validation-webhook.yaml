# NOTE: `clientConfig.service.name` below must be the service declared as
# `KubernetesConfig.otoroshiServiceName` in the Otoroshi configuration — the sink
# answering these calls only matches a Host of
# `<otoroshiServiceName>.<namespace>.svc[.cluster.local]`, and the certificate
# Otoroshi generates for the endpoint carries only those SANs. In a Leader/Worker
# setup that is `otoroshi-worker-service`, not `otoroshi-service`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: otoroshi-admission-webhook-validation
  labels:
    app: otoroshi
    component: otoroshi-validation-webhook
webhooks:
  - name: otoroshi-admission-webhook.otoroshi.io
    rules:
      - operations: 
          - "CREATE"
          - "UPDATE"
        apiGroups: 
          - "proxy.otoroshi.io"
        apiVersions: 
          - "*"
        resources: 
          - "*"
        scope: "Namespaced"
    clientConfig:
      # url: "https://otoroshi-kubernetes-admission-webhook.otoroshi.svc.cluster.local:8443/apis/webhooks/validation"
      service:
        name: otoroshi-service
        namespace: otoroshi
        path: "/apis/webhooks/validation"
        port: 8443
      caBundle: "" # injected at runtime
    failurePolicy: Ignore # inject at runtime
    sideEffects: None
    admissionReviewVersions: 
      - "v1"
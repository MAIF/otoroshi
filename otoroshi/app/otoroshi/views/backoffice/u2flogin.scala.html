@import otoroshi.env.Env

@(_env: Env)

@authScript = {
    @otoroshi.views.html.frontend.viteJs("backoffice", _env)
    <script>
        window.__otoroshiReady(function () {
            Otoroshi.login(document.getElementById("app"), '@(_env.otoroshiLogo)');
        });
    </script>
}

@authStyle = {
    @otoroshi.views.html.frontend.viteCss("backoffice", _env)
}

@unauthmain("Login to Otoroshi dashboard", _env, moreScripts = authScript, moreStyles = authStyle) {
    <div id="app"></div>
}
